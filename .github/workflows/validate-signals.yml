name: Validate Signals

on:
  push:
    paths:
      - 'signals/**/*.json'
      - 'schema/signals.schema.json'
      - 'scripts/validate.py'
      - '.github/workflows/validate-signals.yml'
  pull_request:
    paths:
      - 'signals/**/*.json'
      - 'schema/signals.schema.json'
      - 'scripts/validate.py'
      - '.github/workflows/validate-signals.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Validate signals files
        run: |
          python scripts/validate.py
